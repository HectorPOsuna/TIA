[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.9.1
    mike-matera/ArduinoSTL@^1.3.3
build_flags = 
    -I .
    -I src
    -D ARDUINO=10819
upload_protocol = arduino
monitor_speed = 115200

[env:native_test]
platform = native
lib_deps = 
    throwtheswitch/Unity@^2.5.2
build_flags = 
    -I include
    -I src
    -I test/mocks
    -D UNITY_INCLUDE_CONFIG_H
    -D UNITY_INT_WIDTH=32
test_filter = test_*